<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Basic HTML Structure</title>
    <meta name="description" content="A Basic HTML Structure Using Basic HTML Elements">
    <meta name="author" content="Mike Asiabaka">
</head>

<body>
    <header>
        <img src="sparkles-logo" alt="Company Logo" width="128" height="128">
    </header>
    <nav>
        <ul>
            <li><a href="https://www.sparkles-confectionary.com">BYU-Pathway Worldwide</a></li>

        </ul>
    </nav>
    <main>
        <h1>Basic HTML Structure</h1>
    
        <section>
            <h2>Heading</h2>
            <p>This is a paragraph inside the first section.</p>
        </section>
    
        <section>
            <h2>Heading</h2>
            <p>This is a paragraph inside the second section.</p>
        </section>
    </main>

</html>
