<!DOCTYPE html>
<html lang="en-US">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Us | White Water Rafting Co.</title>

    <meta name="description"
      content="Contact White Water Rafting Co. for reservations, questions, website feedback, and general inquiries.">
    <meta name="author" content="Mike Asiabaka">

    <link rel="stylesheet" href="styles/rafting.css">
</head>

<body>

    <header>
        <img src="images/rafting-site.jpg" alt="White Water Rafting Company Logo">

        <nav>
            <a href="index.html">Home</a>
            <a href="about.html">About Us</a>
            <a href="trips.html">Trips</a>
            <a href="contact.html">Contact Us</a>
        </nav>
    </header>

    <main>

        <h1>Contact Us</h1>

        <section class="contact-info">

            <h2>Company Information</h2>

            <p><strong>Address:</strong> 25 Marina Road, Lagos, Nigeria</p>

            <p><strong>Phone:</strong> +234 800 123 4567</p>

            <p><strong>Email:</strong> info@whitewaterrafting.com</p>

            <iframe src="https://www.google.com/maps?q=Lagos,Nigeria&output=embed" loading="lazy"
              allowfullscreen>
            </iframe>

        </section>

        <section class="employees">

            <h2>Meet Our Team</h2>

            <figure>
                <img src="images/olushade.jpeg" alt="Olushade Aina">
                <figcaption>Olushade Aina - General Manager</figcaption>
            </figure>

            <figure>
                <img src="images/mike.jpg" alt="Mike Asiabaka">
                <figcaption>Mike Asiabaka - River Guide</figcaption>
            </figure>

            <figure>
                <img src="images/mike.jpg" alt="Mike Asiabaka">
                <figcaption>Mike Asiabaka - Reservation Specialist</figcaption>
            </figure>

        </section>

        <section>

            <h2>Send Us a Message</h2>

            <form>

                <div class="form-item column2">
                    <label for="fullname">Full Name</label>
                    <input type="text" id="fullname" name="fullname" required>
                </div>

                <div class="form-item column2">
                    <label for="email">Email</label>
                    <input type="email" id="email" name="email" required>
                </div>

                <fieldset>

                    <legend>Purpose of Message</legend>

                    <label>
                        <input type="radio" name="purpose" value="general" checked>
                        General Inquiry
                    </label>

                    <label>
                        <input type="radio" name="purpose" value="reservation">
                        Reservation Question
                    </label>

                    <label>
                        <input type="radio" name="purpose" value="website">
                        Website Suggestion
                    </label>

                </fieldset>

                <div class="form-item">
                    <label for="message">Message</label>
                    <textarea id="message" name="message" rows="6"></textarea>
                </div>

                <div class="newsletter">
                    <label>
                        <input type="checkbox" name="newsletter">
                        Please subscribe me to the monthly newsletter
                    </label>
                </div>

                <button type="submit">Send Message</button>

            </form>

        </section>

    </main>

    <footer>

        <p>&copy; 2026 White Water Rafting Co. | Mike Asiabaka</p>

        <nav class="socialmedia">

            <a href="https://facebook.com" target="_blank">
                <img src="images/facebook.svg" alt="Facebook">
            </a>

            <a href="https://twitter.com" target="_blank">
                <img src="images/twitter.svg" alt="Twitter">
            </a>

            <a href="https://instagram.com" target="_blank">
                <img src="images/instagram.svg" alt="Instagram">
            </a>

        </nav>

    </footer>

</body>

</html>
