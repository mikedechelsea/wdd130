<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Survey Form</title>
    <link rel="stylesheet" href="poll-form.css">
</head>

<body>

    <header>
        <h1>Simple Survey Form</h1>
    </header>

    <main>
        <form>

            <div class="form-item column2">
                <label for="fullname">Full Name:</label>
                <input type="text" id="fullname" name="fullname">
            </div>
            <div class="form-item column2">
                <label for="useremail">Email:</label>
                <input type="email" id="useremail" name="useremail">
            </div>


            <div class="form-item column2">
                <label for="quantity">Quantity</label>
                <select id="quantity" name="quantity">
                    <option value="1">One</option>
                    <option value="2">Two</option>
                    <option value="3">Three</option>
                </select>
            </div>

            <br>

            <div>
                <label for="browser">What's Your Favorite Internet Browser?</label><br>
                <select id="browser" name="browser">
                    <option value="chrome">Chrome</option>
                    <option value="firefox">Firefox</option>
                    <option value="edge">Edge</option>
                    <option value="brave">Brave</option>
                    <option value="other">Other</option>
                </select>
            </div>

            <br>

            <div>
                <input type="checkbox" id="pet" name="pet">
                <label for="pet">Do you have a household pet?</label>
            </div>

            <br>

            <div>
                <label for="feedback">List the places you've lived</label><br>
                <textarea id="feedback" name="feedback" rows="4"
                  placeholder="Lagos, Nigeria; Accra, Ghana; Cairo, Egypt"></textarea>
            </div>

            <br>

            <button type="submit">Submit Poll</button>

        </form>
    </main>

    <footer>

    </footer>

</body>

</html>
